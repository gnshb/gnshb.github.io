<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{title}</title>
    <meta name="description" content="{description}" />
    <link rel="icon" href="{prefix}favicon.ico" sizes="any" />
    <link rel="stylesheet" href="{prefix}assets/css/latex.css" />
    <link rel="stylesheet" href="{prefix}style.css" />
  </head>
  <body class="{body_class}">
    <div id="page" class="site">
      <header class="site-header">
        <div class="container">
          <div class="site-branding">
            <p class="site-title"><a class="home-link" href="{prefix}">{site_title}</a></p>
          </div>
          <nav class="main-navigation" aria-label="Primary">
            <ul class="menu">
              <li><a href="{prefix}">home</a></li>
              <li><a href="{prefix}projects/">projects</a></li>
              <li><a href="{prefix}blog/">blog</a></li>
              <li><a href="{github}">github</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <div class="container">
        <div class="site-content">
          <div class="content-area column three-fourths">
            <main class="site-main">
              {hero}
              <article class="entry">
                <div class="entry-content">
                  {content}
                </div>
              </article>
            </main>
          </div>

          <aside class="widget-area column fourth">
            {sidebar}
          </aside>
        </div>
      </div>

      <footer class="site-footer">
        <div class="container">
          <p>Markdown content with self-hosted LaTeX.css and a custom static builder.</p>
        </div>
      </footer>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}
    </title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any" />
    <link rel="stylesheet" href="https://latex.vercel.app/style.css" />
    <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}" />
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']]
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <header>
      <h1>{{ site.author.name }}</h1>
      <p class="author site-meta">
        {{ site.author.role }}<br />
        {{ site.author.location }}<br />
        <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a><br />
        <a href="https://github.com/{{ site.author.github }}" rel="noreferrer">GitHub</a>
      </p>
      <nav>
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/projects/' | relative_url }}" {% if page.url == '/projects/' or page.url == '/projects.html' %}aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url == '/blog/' or page.url contains '/blog/' %}aria-current="page"{% endif %}>Blog</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <hr />
      <small>
        For site styling, I use the phenomenal CSS library
        <a href="https://latex.vercel.app/" rel="noreferrer">LaTeX.css</a> by
        <a href="https://github.com/vincentdoerig" rel="noreferrer">Vincent Doerig</a>.
      </small>
    </footer>
  </body>
</html>

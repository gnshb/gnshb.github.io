<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}
    </title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  </head>
  <body>
    <div class="bg-noise"></div>
    <main class="page">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
        <p class="site-role">{{ site.author.role }}</p>
        <p class="site-meta">
          {{ site.author.location }}
          |
          <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
        </p>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/projects/' | relative_url }}" {% if page.url == '/projects/' or page.url == '/projects.html' %}aria-current="page"{% endif %}>Projects</a>
          <a href="{{ '/blog/' | relative_url }}" {% if page.url == '/blog/' or page.url contains '/blog/' %}aria-current="page"{% endif %}>Blog</a>
          <a href="https://github.com/{{ site.author.github }}" rel="noreferrer">GitHub</a>
        </nav>
      </header>

      <section class="content">{{ content }}</section>

      <footer class="site-footer">
        <small>Copyright {{ "now" | date: "%Y" }} {{ site.author.name }}.</small>
      </footer>
    </main>
  </body>
</html>
